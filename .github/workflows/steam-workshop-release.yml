name: Steam Workshop

on:
  push:
    tags:
    - 'v*.*.*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to release'
        required: true

jobs:
  hoi4:
    name: Hearts of Iron IV
    runs-on: ubuntu-latest

    env:
      VERSION: ${{ inputs.tag || github.ref_name }}

    steps:
    - uses: actions/checkout@v7
      with:
        ref: ${{ env.VERSION }}

    - name: Build the mod
      run: |
        python3 scripts/build.py --game hoi4 --version "${VERSION#v}"

    - name: Upload to Steam Workshop
      uses: hmlendea/steam-workshop-update@latest
      with:
        appid: 394360
        itemid: 3845820843
        path: "out/hoi4/standardised-country-colours/"
        changenote: "[url=https://github.com/hmlendea/standardised-country-colours/releases/tag/${{env.VERSION}}]Version ${{env.VERSION}}[/url]"
        icon: "out/hoi4/standardised-country-colours/thumbnail.png"
      env:
        STEAM_USERNAME: ${{secrets.STEAM_USERNAME}}
        STEAM_PASSWORD: ${{secrets.STEAM_PASSWORD}}
        STEAM_2FASEED: ${{secrets.STEAM_2FA_SEED}}

  imperator:
    name: Imperator Rome
    runs-on: ubuntu-latest

    env:
      VERSION: ${{ inputs.tag || github.ref_name }}

    steps:
    - uses: actions/checkout@v7
      with:
        ref: ${{ env.VERSION }}

    - name: Build the mod
      run: |
        python3 scripts/build.py --game imperator --version "${VERSION#v}"

    - name: Upload to Steam Workshop
      uses: hmlendea/steam-workshop-update@latest
      with:
        appid: 859580
        itemid: 3845414842
        path: "out/imperator/standardised-country-colours/"
        changenote: "[url=https://github.com/hmlendea/standardised-country-colours/releases/tag/${{env.VERSION}}]Version ${{env.VERSION}}[/url]"
        icon: "out/imperator/standardised-country-colours/thumbnail.png"
      env:
        STEAM_USERNAME: ${{secrets.STEAM_USERNAME}}
        STEAM_PASSWORD: ${{secrets.STEAM_PASSWORD}}
        STEAM_2FASEED: ${{secrets.STEAM_2FA_SEED}}

  victoria3:
    name: Victoria 3
    runs-on: ubuntu-latest

    env:
      VERSION: ${{ inputs.tag || github.ref_name }}

    steps:
    - uses: actions/checkout@v7
      with:
        ref: ${{ env.VERSION }}

    - name: Build the mod
      run: |
        python3 scripts/build.py --game victoria3 --version "${VERSION#v}"

    - name: Upload to Steam Workshop
      uses: hmlendea/steam-workshop-update@latest
      with:
        appid: 529340
        itemid: 3844790373
        path: "out/vic3/standardised-country-colours/"
        changenote: "[url=https://github.com/hmlendea/standardised-country-colours/releases/tag/${{env.VERSION}}]Version ${{env.VERSION}}[/url]"
        icon: "out/vic3/standardised-country-colours/thumbnail.png"
      env:
        STEAM_USERNAME: ${{secrets.STEAM_USERNAME}}
        STEAM_PASSWORD: ${{secrets.STEAM_PASSWORD}}
        STEAM_2FASEED: ${{secrets.STEAM_2FA_SEED}}
